# This workflow:
#   - lints the chart, runs tests and verifies documentation is up to date
# Additionally if the event isn't a pull-request (and hence a merge/push to main):
#   - sync README to gh-pages branch
#   - release a new chart version if the version isn't already released
#   - push released chart versions to GitHub Container Registry as OCI artifacts
name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:

# Cancel previous PR builds.
concurrency:
  # Cancel all workflow runs except latest within a concurrency group. This is achieved by defining a concurrency group for the PR.
  # Non-PR builds have singleton concurrency groups.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.number || github.sha }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up chart-testing
        uses: helm/chart-testing-action@v2.9.0
      - name: Lint charts
        run: ct lint --charts=charts/trino,charts/gateway --validate-maintainers=false

  unittest:
    runs-on: ubuntu-latest
    name: unit tests
    steps:
      - uses: actions/checkout@v7
      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v4.3.1
      # Helm 4 refuses to install a plugin it cannot verify, and a plugin
      # installed from a git source has nothing to verify against.
      - name: Install helm-unittest
        run: helm plugin install https://github.com/helm-unittest/helm-unittest --version 1.2.1 --verify=false
      - name: Run unit tests
        run: helm unittest charts/trino charts/gateway
      # helm-unittest supplies values the way a values file does, so it cannot
      # reach defects that only appear when a value arrives through --set, where
      # Helm types numbers as int64 rather than float64.
      - name: Render with values supplied through --set
        run: |
          helm template t charts/trino \
            --set worker.gracefulShutdown.enabled=true \
            --set worker.gracefulShutdown.gracePeriodSeconds=120 \
            --set worker.terminationGracePeriodSeconds=300 >/dev/null

  changes:
    runs-on: ubuntu-latest
    name: changed trino/gateway files
    outputs:
      trino-changed: ${{ steps.filter.outputs.trino }}
      gateway-changed: ${{ steps.filter.outputs.gateway }}
    steps:
      - uses: actions/checkout@v7
      # Detect changes in trino/gatway files to conditionally run tests
      - name: Get changed related files
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d
        id: filter
        with:
          filters: |
            trino:
              - 'charts/trino/**'
              - 'tests/**'
              - '.helmignore'
              - '.github/**'
              - '.gitignore'
            gateway:
              - 'charts/gateway/**'
              - 'tests/**'
              - '.helmignore'
              - '.github/**'
              - '.gitignore'

  test:
    runs-on: ubuntu-latest
    name: trino ${{ matrix.group.name }} ${{ matrix.tag || 'latest' }}
    needs: [changes, lint, unittest]
    if: ${{needs.changes.outputs.trino-changed == 'true'}}
    strategy:
      fail-fast: false
      matrix:
        # Grouped by the prerequisites a case needs, so a leg only installs what
        # it uses. Cases within a leg run one at a time: chart defaults are two
        # workers with an 8G heap each, so a kind node cannot hold several
        # releases at once.
        group:
          - { name: core, cases: 'default,single-node,access-control-properties', fixtures: '' }
          - { name: extras, cases: 'graceful-shutdown,worker-access-control,exchange-manager', fixtures: '' }
          - { name: monitoring, cases: 'complete', fixtures: 'prometheus,keda' }
          - { name: database, cases: 'resource-groups-properties', fixtures: 'postgres' }
          - { name: gateway-api, cases: 'gateway', fixtures: 'gateway-api' }
          - { name: opa, cases: 'opa', fixtures: '' }
        tag:
          - ''
          # last Trino version that requires JDK 21
          - '446'
          # last Trino version that requires JDK 17
          - '435'
        exclude:
          # the OPA access control plugin arrived in Trino 438, and the plugin
          # itself has not changed since, so this case runs on the default tag
          - group: { name: opa, cases: 'opa', fixtures: '' }
            tag: '446'
          - group: { name: opa, cases: 'opa', fixtures: '' }
            tag: '435'
    steps:
      - uses: actions/checkout@v7
      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v4.3.1
      - name: Create kind cluster
        uses: helm/kind-action@v1.15.1
        with:
          version: v0.33.0
      - name: Run tests
        run: |
          ./tests/run.sh trino \
            --cases '${{ matrix.group.cases }}' \
            ${{ matrix.group.fixtures && format('--fixtures ''{0}''', matrix.group.fixtures) || '' }} \
            ${{ matrix.tag && format('--tag {0}', matrix.tag) || '' }}

  test-multi-release:
    runs-on: ubuntu-latest
    name: trino multi-release
    needs: [changes, lint, unittest]
    if: ${{needs.changes.outputs.trino-changed == 'true'}}
    steps:
      - uses: actions/checkout@v7
      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v4.3.1
      - name: Create kind cluster
        uses: helm/kind-action@v1.15.1
        with:
          version: v0.33.0
      # --retain keeps both releases installed at once, which is what this checks:
      # that two releases of the chart can coexist in one namespace.
      - name: Run tests
        run: ./tests/run.sh trino --cases default,overrides --retain

  test-gateway:
    runs-on: ubuntu-latest
    name: gateway ${{ matrix.group.name }}
    needs: [changes, lint, unittest]
    if: ${{needs.changes.outputs.gateway-changed == 'true'}}
    strategy:
      fail-fast: false
      matrix:
        group:
          - { name: monitoring, cases: 'complete', fixtures: 'prometheus,postgres' }
          - { name: database, cases: 'env-from,https,nodeport', fixtures: 'postgres' }
    steps:
      - uses: actions/checkout@v7
      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v4.3.1
      - name: Create kind cluster
        uses: helm/kind-action@v1.15.1
        with:
          version: v0.33.0
      - name: Run gateway tests
        run: |
          ./tests/run.sh gateway \
            --cases '${{ matrix.group.cases }}' \
            --fixtures '${{ matrix.group.fixtures }}'

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - uses: pre-commit/action@v3.0.1

  # Everything above is CI, everything here and below is for releases and runs only on non-pull-request events
  sync-readme:
    needs: [lint, unittest, test, test-multi-release, test-gateway, docs]
    runs-on: ubuntu-latest
    if: ${{ always() && !failure() && github.event_name != 'pull_request'}}
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          path: main
      - name: Checkout gh-pages
        uses: actions/checkout@v7
        with:
          ref: gh-pages
          path: gh-pages
      - name: Copy all README files from main to gh-pages
        run: |
          cd main
          # cp --parents preserves directory structure
          find . -name 'README.md' -exec cp --parents '{}' "../gh-pages/" ';'
      - name: Commit changes to gh-pages and push
        run: |
          cd gh-pages
          git add .
          git config user.name "GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"
          # Commit only if changes exist to avoid failure in this step
          git diff-index --quiet HEAD || git commit --signoff -m "Sync READMEs from main"
          git push

  release:
    needs: [lint, unittest, test, test-multi-release, test-gateway, docs, sync-readme]
    runs-on: ubuntu-latest
    if: ${{ always() && !failure() && github.event_name != 'pull_request'}}
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v4.3.1
      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"
      - name: Release charts
        id: release
        uses: helm/chart-releaser-action@v1.7.0
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          CR_GENERATE_RELEASE_NOTES: true
          # If we didn't bump the chart version then we can skip the release
          CR_SKIP_EXISTING: true
      # chart-releaser lists every chart modified since the latest tag, whether
      # or not its version was bumped, so an already published version is
      # checked for in the registry the same way CR_SKIP_EXISTING checks for a
      # release. Pushing the packages chart-releaser built keeps the OCI
      # artifact identical to the release asset.
      - name: Push charts to GHCR
        if: ${{ steps.release.outputs.changed_charts != '' }}
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        run: |
          # registry namespaces must be lowercase, repository owners need not be
          registry="oci://ghcr.io/${GITHUB_REPOSITORY,,}"
          helm registry login ghcr.io -u "$GITHUB_ACTOR" --password-stdin <<< "$GITHUB_TOKEN"
          for package in .cr-release-packages/*.tgz; do
            name=$(helm show chart "$package" | sed -n 's/^name: //p')
            version=$(helm show chart "$package" | sed -n 's/^version: //p')
            if helm show chart "$registry/$name" --version "$version" >/dev/null 2>&1; then
              echo "$name $version is already in GHCR, skipping"
              continue
            fi
            helm push "$package" "$registry"
          done
