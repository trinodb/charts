{{- if .Values.dbCredentials.enabled }}
{{- $db := dict }}
{{- range .Values.postgres.databases }}
  {{- if eq .name $.Values.dbCredentials.database }}
    {{- $db = . }}
  {{- end }}
{{- end }}
{{- if not $db.user }}
  {{- fail (printf "dbCredentials.database %q is not declared in postgres.databases" .Values.dbCredentials.database) }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.dbCredentials.name }}
type: Opaque
stringData:
  PG_USER: {{ $db.user | quote }}
  PG_PASSWORD: {{ $db.password | quote }}
{{- end }}
