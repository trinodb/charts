{{- if .Values.postgres.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.postgres.serviceName }}-init
  labels:
    app.kubernetes.io/name: {{ .Values.postgres.serviceName }}
data:
  init.sql: |
    {{- range .Values.postgres.databases }}
    CREATE ROLE {{ .user }} WITH LOGIN PASSWORD '{{ .password }}';
    CREATE DATABASE {{ .name }} OWNER {{ .user }};
    {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.postgres.serviceName }}
  labels:
    app.kubernetes.io/name: {{ .Values.postgres.serviceName }}
spec:
  ports:
    - name: postgresql
      port: {{ .Values.postgres.port }}
      targetPort: postgresql
  selector:
    app.kubernetes.io/name: {{ .Values.postgres.serviceName }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.postgres.serviceName }}
  labels:
    app.kubernetes.io/name: {{ .Values.postgres.serviceName }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.postgres.serviceName }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Values.postgres.serviceName }}
    spec:
      containers:
        - name: postgresql
          image: {{ .Values.postgres.image.repository }}:{{ .Values.postgres.image.tag }}
          imagePullPolicy: {{ .Values.postgres.image.pullPolicy }}
          ports:
            - name: postgresql
              containerPort: 5432
          env:
            - name: POSTGRES_PASSWORD
              value: {{ .Values.postgres.superuserPassword | quote }}
          readinessProbe:
            exec:
              command: ['pg_isready', '-U', 'postgres']
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
            # Covers both the pre-18 and the 18+ PGDATA layout of the official image.
            - name: data
              mountPath: /var/lib/postgresql
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
      volumes:
        - name: init
          configMap:
            name: {{ .Values.postgres.serviceName }}-init
        - name: data
          emptyDir: {}
{{- end }}
