serviceName: trino-gateway-complete

replicaCount: 1

image:
  # -- Repository location of the Trino Gateway image, typically `organization/imagename`
  repository: "trinodb/trino-gateway"
  pullPolicy: IfNotPresent

config:
  serverConfig:
    node.environment: test
  dataStore:
    # The connection details for the backend database for Trino Gateway and Trino query history
    jdbcUrl: jdbc:postgresql://postgresql:5432/gateway
    user: gateway
    password: pass0000
    driver: org.postgresql.Driver
  clusterStatsConfiguration:
    monitorType: INFO_API

initContainers:
  - name: wait-for-service
    image: busybox:1.28
    imagePullPolicy: IfNotPresent
    command: ['sh', '-c', "until nslookup {{ .Values.serviceName }}.$(cat /var/run/secrets/kubernetes.io/serviceaccount/namespace).svc.cluster.local; do echo waiting for myservice; sleep 2; done"]

ingress:
  enabled: true

# exercises that the API server accepts the HTTPRoute next to the Ingress; the
# parent Gateway does not need to exist for that
httpRoute:
  enabled: true
  parentRefs:
    - name: shared-gateway
  hostnames:
    - trino-gateway.example.com

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 250m
    memory: 256Mi

serviceMonitor:
  enabled: true
  labels:
    prometheus: default
  interval: "1s"

service:
  # exercises that the API server accepts a Service carrying annotations, which
  # the rendering tests cannot establish on their own
  annotations:
    trino.io/test-annotation: service-annotations
