serviceName: trino-gateway-https

replicaCount: 1
image:
  # -- Repository location of the Trino Gateway image, typically `organization/imagename`
  repository: "trinodb/trino-gateway"
  pullPolicy: IfNotPresent
config:
  serverConfig:
    node.environment: test
    http-server.http.enabled: false
    http-server.https.enabled: true
    http-server.https.port: 8443
    http-server.https.keystore.path: /etc/scratch/tls.pem
  dataStore:
    # The connection details for the backend database for Trino Gateway and Trino query history
    jdbcUrl: jdbc:postgresql://gateway-backend-db-postgresql.postgres-gateway.svc.cluster.local:5432/gateway
    user: gateway
    password: pass0000
    driver: org.postgresql.Driver
  clusterStatsConfiguration:
    monitorType: INFO_API
initContainers:
  - name: wait-for-service
    image: busybox:1.28
    imagePullPolicy: IfNotPresent
    command: ['sh', '-c', "until nslookup {{ .Values.serviceName }}.$(cat /var/run/secrets/kubernetes.io/serviceaccount/namespace).svc.cluster.local; do echo waiting for myservice; sleep 2; done"]
ingress:
  enabled: true
resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 250m
    memory: 256Mi
# Disable ServiceMonitor - Prometheus is only installed for complete_values test
serviceMonitor:
  enabled: false
  labels:
    prometheus: default
  interval: "1s"
command:
  - "/bin/sh"
  - "-c"
  - |
    cat /etc/certificates/tls.crt /etc/certificates/tls.key > /etc/scratch/tls.pem && \
    java -XX:MinRAMPercentage=80.0 -XX:MaxRAMPercentage=80.0 -jar /usr/lib/trino-gateway/gateway-ha-jar-with-dependencies.jar /etc/trino-gateway/config.yaml
volumes:
  - name: certificates
    secret:
      secretName: certificates
  - name: scratch
    emptyDir:
      sizeLimit: 10Mi
volumeMounts:
  - name: certificates
    mountPath: /etc/certificates
    readOnly: true
  - name: scratch
    mountPath: /etc/scratch
