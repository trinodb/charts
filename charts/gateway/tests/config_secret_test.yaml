suite: The rendered gateway config carries only the keys the app accepts
templates:
  - templates/secrets.yaml
tests:
  - it: names the secret so the deployment can mount it
    set:
      serviceName: gw
    asserts:
      - equal:
          path: metadata.name
          value: RELEASE-NAME-trino-gateway-configuration

  - it: omits the http port by default, which Gateway 21 rejects as unused
    set:
      serviceName: gw
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "http-server\\.http\\.enabled: true"
          decodeBase64: true
      - notMatchRegex:
          path: data["config.yaml"]
          pattern: "http-server\\.http\\.port"
          decodeBase64: true

  - it: keeps the http port out of an https-only configuration
    values:
      - ../ci/https-values.yaml
    asserts:
      - notMatchRegex:
          path: data["config.yaml"]
          pattern: "http-server\\.http\\.port"
          decodeBase64: true
      - matchRegex:
          path: data["config.yaml"]
          pattern: "http-server\\.https\\.enabled: true"
          decodeBase64: true

  - it: passes an environment variable reference through unmangled
    set:
      serviceName: gw
      config.dataStore.password: ${ENV:PG_PASSWORD}
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'password: \$\{ENV:PG_PASSWORD\}'
          decodeBase64: true
