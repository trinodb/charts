suite: An existing Secret can replace the configuration rendered from config
templates:
  - templates/deployment.yaml
  - templates/secrets.yaml
tests:
  - it: mounts the configuration Secret the chart renders by default
    template: templates/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.volumes[0]
          value:
            name: RELEASE-NAME-trino-gateway-configuration
            secret:
              secretName: RELEASE-NAME-trino-gateway-configuration
              optional: false

  - it: skips its own configuration Secret when configSecret is set
    template: templates/secrets.yaml
    set:
      configSecret: my-gateway-config
    asserts:
      - hasDocuments:
          count: 0

  - it: mounts the Secret named by configSecret at the same path
    template: templates/deployment.yaml
    set:
      configSecret: my-gateway-config
    asserts:
      - equal:
          path: spec.template.spec.volumes[0]
          value:
            name: RELEASE-NAME-trino-gateway-configuration
            secret:
              secretName: my-gateway-config
              optional: false
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[0]
          value:
            name: RELEASE-NAME-trino-gateway-configuration
            mountPath: /etc/trino-gateway/config.yaml
            subPath: config.yaml
            readOnly: true

  - it: still sets the ports from config.serverConfig
    template: templates/deployment.yaml
    set:
      configSecret: my-gateway-config
      config:
        serverConfig:
          http-server.http.port: 9080
    asserts:
      - equal:
          path: spec.template.spec.containers[0].ports[0].containerPort
          value: 9080
