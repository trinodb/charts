# No ci values file covers this: a pod with a secrets-store.csi.k8s.io volume
# stays in ContainerCreating unless the driver and a provider are installed in
# the cluster, which the kind cluster in .github/workflows/ci-cd.yaml does not
# have. What the template renders is all there is to check here, because the API
# server does not transform a volume or a volume mount.
suite: Secrets Store CSI secrets are mounted only on the roles they are declared for
templates:
  - templates/deployment-coordinator.yaml
  - templates/deployment-worker.yaml
  # the deployments include these to checksum them into pod annotations, so they
  # have to be loaded even though nothing asserts on them
  - templates/configmap-access-control-coordinator.yaml
  - templates/configmap-access-control-worker.yaml
  - templates/configmap-catalog.yaml
  - templates/configmap-coordinator.yaml
  - templates/configmap-worker.yaml
tests:
  - it: declares no csi volume by default
    asserts:
      - notExists:
          path: spec.template.spec.volumes[?(@.csi)]
        template: templates/deployment-coordinator.yaml
      - notExists:
          path: spec.template.spec.volumes[?(@.csi)]
        template: templates/deployment-worker.yaml

  - it: mounts a shared secret on both roles
    set:
      csiSecretMounts:
        - name: shared-csi-secret
          secretProviderClass: shared-secret-provider-class
          path: /secrets/shared.json
          subPath: shared.json
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: shared-csi-secret
            csi:
              driver: secrets-store.csi.k8s.io
              readOnly: true
              volumeAttributes:
                secretProviderClass: shared-secret-provider-class
        template: templates/deployment-coordinator.yaml
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: shared-csi-secret
            mountPath: /secrets/shared.json
            subPath: shared.json
        template: templates/deployment-coordinator.yaml
      - contains:
          path: spec.template.spec.volumes
          content:
            name: shared-csi-secret
            csi:
              driver: secrets-store.csi.k8s.io
              readOnly: true
              volumeAttributes:
                secretProviderClass: shared-secret-provider-class
        template: templates/deployment-worker.yaml
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: shared-csi-secret
            mountPath: /secrets/shared.json
            subPath: shared.json
        template: templates/deployment-worker.yaml

  # a volume mounted on one role must not reach the other, and a volume without
  # its matching mount, or a mount without its volume, makes the pod unschedulable
  - it: keeps a per-role secret off the other role, with its mount
    set:
      coordinator.csiSecretMounts:
        - name: coordinator-csi-secret
          secretProviderClass: coordinator-secret-provider-class
          path: /secrets/coordinator.json
      worker.csiSecretMounts:
        - name: worker-csi-secret
          secretProviderClass: worker-secret-provider-class
          path: /secrets/worker.json
    asserts:
      - contains:
          path: spec.template.spec.volumes
          any: true
          content:
            name: coordinator-csi-secret
        template: templates/deployment-coordinator.yaml
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: coordinator-csi-secret
            mountPath: /secrets/coordinator.json
        template: templates/deployment-coordinator.yaml
      - notContains:
          path: spec.template.spec.volumes
          any: true
          content:
            name: worker-csi-secret
        template: templates/deployment-coordinator.yaml
      - notContains:
          path: spec.template.spec.containers[0].volumeMounts
          any: true
          content:
            name: worker-csi-secret
        template: templates/deployment-coordinator.yaml
      - contains:
          path: spec.template.spec.volumes
          any: true
          content:
            name: worker-csi-secret
        template: templates/deployment-worker.yaml
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: worker-csi-secret
            mountPath: /secrets/worker.json
        template: templates/deployment-worker.yaml
      - notContains:
          path: spec.template.spec.volumes
          any: true
          content:
            name: coordinator-csi-secret
        template: templates/deployment-worker.yaml
      - notContains:
          path: spec.template.spec.containers[0].volumeMounts
          any: true
          content:
            name: coordinator-csi-secret
        template: templates/deployment-worker.yaml

  - it: omits the subPath from a shared mount that does not ask for one
    set:
      csiSecretMounts:
        - name: shared-csi-secret
          secretProviderClass: shared-secret-provider-class
          path: /secrets/shared.json
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: shared-csi-secret
            mountPath: /secrets/shared.json
        template: templates/deployment-coordinator.yaml
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: shared-csi-secret
            mountPath: /secrets/shared.json
        template: templates/deployment-worker.yaml

  - it: resolves a templated secret provider class on both roles
    set:
      csiSecretMounts:
        - name: shared-csi-secret
          secretProviderClass: "{{ .Release.Namespace }}-secret-provider-class"
          path: /secrets/shared.json
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: shared-csi-secret
            csi:
              driver: secrets-store.csi.k8s.io
              readOnly: true
              volumeAttributes:
                secretProviderClass: NAMESPACE-secret-provider-class
        template: templates/deployment-coordinator.yaml
      - contains:
          path: spec.template.spec.volumes
          content:
            name: shared-csi-secret
            csi:
              driver: secrets-store.csi.k8s.io
              readOnly: true
              volumeAttributes:
                secretProviderClass: NAMESPACE-secret-provider-class
        template: templates/deployment-worker.yaml
