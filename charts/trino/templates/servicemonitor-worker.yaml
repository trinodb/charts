{{- $workerServiceMonitor := include "trino.roleConfig" (dict "block" .Values.serviceMonitor "role" "worker") | fromYaml -}}
{{- $workerJmx := include "trino.roleConfig" (dict "block" .Values.jmx "role" "worker") | fromYaml -}}
{{- if and $workerServiceMonitor.enabled $workerServiceMonitor.openMetrics.enabled }}
{{- include "trino.checkWorkerScrapePassword" . }}
{{- end }}
{{- if $workerServiceMonitor.enabled }}
apiVersion: {{ $workerServiceMonitor.apiVersion }}
kind: ServiceMonitor
metadata:
  name: {{ template "trino.fullname" . }}-worker
  namespace: {{ .Release.Namespace }}
  labels:
    {{- $labels := include "trino.labels" . | fromYaml }}
    {{- range $key, $value := $workerServiceMonitor.labels }}
    {{- $_ := set $labels $key $value }}
    {{- end }}
    {{- toYaml $labels | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "trino.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: worker
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
  endpoints:
    {{- include "trino.serviceMonitorEndpoints" (dict "context" . "role" "worker" "serviceMonitor" $workerServiceMonitor "jmx" $workerJmx) | nindent 4 }}
{{- end }}
