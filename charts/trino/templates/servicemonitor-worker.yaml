{{- $workerServiceMonitor := include "trino.roleConfig" (dict "block" .Values.serviceMonitor "role" "worker") | fromYaml -}}
{{- if $workerServiceMonitor.enabled }}
apiVersion: {{ $workerServiceMonitor.apiVersion }}
kind: ServiceMonitor
metadata:
  name: {{ template "trino.fullname" . }}-worker
  namespace: {{ .Release.Namespace }}
  labels:
    {{- $labels := include "trino.labels" . | fromYaml }}
    {{- range $key, $value := $workerServiceMonitor.labels }}
    {{- $_ := set $labels $key $value }}
    {{- end }}
    {{- toYaml $labels | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "trino.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: worker
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
  endpoints:
    - port: jmx-exporter
      interval: {{ $workerServiceMonitor.interval }}
      {{- if $workerServiceMonitor.scrapeTimeout }}
      scrapeTimeout: {{ $workerServiceMonitor.scrapeTimeout }}
      {{- end }}
{{- end }}
