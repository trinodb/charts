{{- $coordinatorServiceMonitor := include "trino.roleConfig" (dict "block" .Values.serviceMonitor "role" "coordinator") | fromYaml -}}
{{- if $coordinatorServiceMonitor.enabled -}}
apiVersion: {{ $coordinatorServiceMonitor.apiVersion }}
kind: ServiceMonitor
metadata:
  name: {{ template "trino.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- $labels := include "trino.labels" . | fromYaml }}
    {{- range $key, $value := $coordinatorServiceMonitor.labels }}
    {{- $_ := set $labels $key $value }}
    {{- end }}
    {{- toYaml $labels | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "trino.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: coordinator
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
  endpoints:
    {{- include "trino.serviceMonitorEndpoints" (dict "serviceMonitor" $coordinatorServiceMonitor) | nindent 4 }}
{{- end }}
