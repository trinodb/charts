{{- $coordinatorServiceMonitor := include "trino.roleConfig" (dict "block" .Values.serviceMonitor "role" "coordinator") | fromYaml -}}
{{- if and $coordinatorServiceMonitor.enabled $coordinatorServiceMonitor.openMetrics.enabled (not $coordinatorServiceMonitor.openMetrics.authSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "trino.serviceMonitorAuthSecretName" (dict "context" . "role" "coordinator" "serviceMonitor" $coordinatorServiceMonitor) }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "trino.labels" . | nindent 4 }}
    app.kubernetes.io/component: coordinator
type: Opaque
stringData:
  username: {{ $coordinatorServiceMonitor.openMetrics.username | quote }}
  password: {{ $coordinatorServiceMonitor.openMetrics.password | quote }}
{{- end }}
{{- $workerServiceMonitor := include "trino.roleConfig" (dict "block" .Values.serviceMonitor "role" "worker") | fromYaml -}}
{{- if and $workerServiceMonitor.enabled $workerServiceMonitor.openMetrics.enabled (not $workerServiceMonitor.openMetrics.authSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "trino.serviceMonitorAuthSecretName" (dict "context" . "role" "worker" "serviceMonitor" $workerServiceMonitor) }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "trino.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
type: Opaque
stringData:
  username: {{ $workerServiceMonitor.openMetrics.username | quote }}
  password: {{ $workerServiceMonitor.openMetrics.password | quote }}
{{- end }}
